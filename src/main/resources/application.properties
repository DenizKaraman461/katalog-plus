spring.application.name=katalog
server.port=8080
server.address=0.0.0.0

spring.servlet.multipart.enabled=true
server.tomcat.max-part-count=100
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.web.resources.static-locations=classpath:/static/,file:uploads/
upload.path=uploads

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/katalogb?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Europe/Istanbul}
spring.datasource.username=${DB_USERNAME:deniz}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Bildirimlerin gideceği adresler. Virgülle birden fazla adres yazılabilir;
# EmailService bunları ayırıp her birine ayrı ayrı gönderir.
app.company.email=denizcelikhalat363@gmail.com,karamandeniz363@gmail.com
# Sipariş bildirimleri de aynı listeye gitsin (tek kaynak -> iki property asla ayrışmaz).
app.order.notify-email=${app.company.email}

# =====================================================================
# ÖDEME (iyzico Checkout Form) AYARLARI
# API key / secret ASLA burada düz yazılmaz; ortam değişkeninden okunur.
# Sandbox varsayılanı: https://sandbox-api.iyzipay.com (canlıya geçince
# IYZICO_BASE_URL=https://api.iyzipay.com olarak ayarlanmalı).
# =====================================================================
app.payment.iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
app.payment.iyzico.api-key=${IYZICO_API_KEY:}
app.payment.iyzico.secret-key=${IYZICO_SECRET_KEY:}

# iyzico'nun ödeme sonrası tarayıcıyı POST edeceği adres (PaymentController#callback).
# Sunucunuzun dışarıdan erişilebilir adresiyle güncelleyin (localhost testte iyzico'ya ulaşmaz;
# geliştirmede ngrok/localtunnel gibi bir tünel adresi kullanın).
app.payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:8080/payment/callback}

# =====================================================================
# EUR/USD -> TRY ÖDEME DÖNÜŞÜMÜ (CANLI KUR — TCMB)
# Ürünler sitede kendi para biriminde (EUR/USD/TRY) görünmeye devam eder; bu SADECE
# iyzico'ya gönderilecek tahsilat tutarını TRY'ye çevirmek için kullanılır (Order.currency/
# Order.totalAmount/OrderItem.currencySnapshot bundan ETKİLENMEZ).
#
# GÜVENLİK: Kur TCMB'den (today.xml, Döviz Satış/ForexSelling) çekilir. TCMB'ye erişilemez ve
# geçerli bir cache de yoksa ödeme BAŞLATILMAZ (kullanıcıya hata gösterilir) — asla sessizce
# bir "fallback" kurla otomatik ödeme alınmaz.
# =====================================================================
app.payment.exchange.tcmb-url=https://www.tcmb.gov.tr/kurlar/today.xml

# Çekilen kura eklenecek margin (%) - effectiveRate = fetchedRate * (1 + margin/100)
app.payment.exchange.margin-percent=2.0

# Cache'teki kurun geçerli sayılacağı maksimum yaş (dakika). Bu süreyi geçen kur BAYAT sayılır
# ve kullanılmaz; TCMB'den yeniden çekilir.
app.payment.exchange.max-age-minutes=60

# TRY'ye çevrilmiş ödeme tutarı bu eşiği (TL) aşarsa otomatik ödeme başlatılmaz, manuel onay
# istenir (bkz. PaymentService - "büyük sipariş güvenliği").
app.payment.exchange.manual-approval-threshold-try=50000

# ---- FALLBACK (yalnızca development/test!) ----
# GÜVENLİK: allow-fallback varsayılan olarak false'tur ve production application.properties'te
# BÖYLE KALMALIDIR. TCMB erişilemezse ve bu bayrak true ise (yalnızca dev/test profilinde
# bilinçli olarak açılmalı) aşağıdaki manuel kurlar kullanılır; aksi halde ödeme başlatılmaz.
app.payment.exchange.allow-fallback=false
app.payment.exchange.fallback.eur-to-try=43.00
app.payment.exchange.fallback.usd-to-try=40.00

# Ortam değişkenleri (örnek):
#   IYZICO_API_KEY    = sandbox-... (iyzico Merchant panelinden)
#   IYZICO_SECRET_KEY = sandbox-... (iyzico Merchant panelinden)
#   PAYMENT_CALLBACK_URL = https://sizin-alan-adiniz.com/payment/callback

# =====================================================================
# SİTE URL'İ (şifre sıfırlama linki gibi mutlak URL üretilen yerlerde kullanılır)
# =====================================================================
app.base-url=https://denizcelikhalat.com

# =====================================================================
# KARGO — LOJİSTİK KATEGORİ EŞİKLERİ (AŞAMA 3B)
# Kargo ÜCRETİ hesaplanmaz; bu değerler yalnızca toplam ağırlığa göre sınıflandırma
# (STANDARD / HEAVY_CARGO / MANUAL_REVIEW) için kullanılır (bkz. ShippingService).
# 0 - standard-max-weight (dahil)      -> STANDARD
# standard-max-weight - heavy-max-weight (dahil) -> HEAVY_CARGO
# heavy-max-weight üzeri                -> MANUAL_REVIEW
# =====================================================================
app.shipping.standard-max-weight=50
app.shipping.heavy-max-weight=300

# =====================================================================
# KARGO — TAHMİNİ ÜCRET HESABI (AŞAMA 4A)
# Henüz checkout/Order/ödeme akışına BAĞLI DEĞİLDİR; yalnızca ShippingCostService'in
# kullandığı bağımsız hesaplama motoru konfigürasyonudur.
# Hesap: base-cost + (kg × per-kg-cost). MANUAL_REVIEW kategorisinde ücret hesaplanmaz.
# =====================================================================
# STANDARD KARGO
app.shipping.standard.base-cost=150
app.shipping.standard.per-kg-cost=8

# HEAVY KARGO
app.shipping.heavy.base-cost=500
app.shipping.heavy.per-kg-cost=5